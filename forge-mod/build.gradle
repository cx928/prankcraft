// PrankCraft Forge module - build script.
//
// Mirrors the Paper plugin in prankcraft/core: same packages, same class names where the
// platform allows, same safety model. The differences are only where Forge 1.16.5 forces
// them (net.minecraft.* names instead of org.bukkit.*, sending a ClientboundBlockUpdatePacket
// to ServerPlayer.connection instead of Player#sendBlockChange, and so on).
buildscript {
    repositories {
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 5 is the 1.16.5-capable line. This is pinned rather than "5.1.+" on purpose:
        // a floating version means two machines can produce different jars from the same commit,
        // and the 5.1.x line changed how it resolves the mapped Minecraft/Forge artifact several
        // times. 5.1.15 is the version the 1.16.5 modding guides settle on; override it with
        // -Pforgegradle.version=... if you need to test another.
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle',
                version: project.findProperty('forgegradle.version') ?: '5.1.15', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'java'

version = "${mod_version}"
group = "${mod_group}"
archivesBaseName = "prankcraft-forge-${minecraft_version}"

// Java 8 bytecode: a 1.16.5 server runs on Java 8 through 16, and nothing here needs newer.
//
// Deliberately sourceCompatibility/targetCompatibility rather than a Java toolchain: a toolchain
// block makes Gradle demand a locally installed JDK 8 (or a toolchain repository to download one)
// just to produce the same class files, which turns a one-line build into a provisioning problem
// on every machine. Compiling with the build's own JDK for release 8 gives identical bytecode with
// no extra requirements.
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    // Official (Mojang) mappings, as required. Every net.minecraft.* symbol referenced by
    // this mod resolves through these names - see README.md for the ones that differ when
    // you move to Parchment or MCP snapshot mappings.
    mappings channel: "${mappings_channel}", version: "${mappings_version}"

    // No access transformer is needed. Every symbol this mod touches is public API: the mod
    // reaches a single connection through the public `ServerPlayer.connection` field and calls
    // its public `send(Packet)`, and it spawns entities through the public EntityType/ServerLevel
    // API. If a future Forge version tightens any of those, an accesstransformer.cfg registered
    // here is where the fix belongs - not a reflection fallback that silently stops working.

    // `runs { }` is intentionally left out of the committed build.
    //
    // ForgeGradle's RunConfigGenerator resolves the full runtime classpath (including the mapped
    // Minecraft/Forge artifact) during project configuration, through a Gradle Provider that has no
    // task dependency on the MCP pipeline which produces that artifact. On a machine where the
    // artifact is not already cached this fails during configuration, before any task runs:
    //
    //   Could not find net.minecraftforge:forge:1.16.5-36.2.34_mapped_official_1.16.5
    //
    // This module is server-side only and never needs runClient/runServer: the way to test it is to
    // copy build/libs/*.jar into a real Forge server's mods/ directory, which is the only
    // environment the mod is written for. If you do want the dev run configs, add back:
    //
    //   runs {
    //       client { workingDirectory project.file('run'); mods { prankcraft { source sourceSets.main } } }
    //       server { workingDirectory project.file('run'); mods { prankcraft { source sourceSets.main } } }
    //   }
    //
    // ...and generate the mapped artifact first (for example with `gradlew classes` on a machine
    // where the MCP pipeline completes).
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // No bundled libraries. The audit log and consent store are written with
    // java.nio + hand-rolled parsing (see com.prankcraft.util.Json), because shading a
    // JSON library into a Forge mod is how you end up on the wrong side of a
    // classloader conflict with another mod on the same server.
}

// The mods.toml is a template: Gradle substitutes the version and mod id at build time,
// so the manifest and the metadata file can never drift apart.
processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_description', mod_description
    inputs.property 'mod_authors', mod_authors
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'forge_version', forge_version

    filesMatching('META-INF/mods.toml') {
        expand(
                'version': project.version,
                'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_description': mod_description,
                'mod_authors': mod_authors,
                'minecraft_version': minecraft_version,
                'forge_version': forge_version
        )
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Compile against the JDK 8 API surface, so a stray Optional.isEmpty() or List.of() fails the
    // build here instead of failing at runtime on a Java 8 server. This is the whole reason the
    // release flag is set: targetCompatibility only guarantees the class file version, not that
    // the APIs used exist in Java 8.
    if (JavaVersion.current().isJava9Compatible()) {
        options.compilerArgs.addAll(['--release', '8'])
    }
}

// Gradle 7 still supports Java 8; javadoc on modern JDKs is noisy about it, so keep it
// quiet rather than letting warnings hide a real problem.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

// Only build/libs/*.jar is shipped. `gradlew build` runs `reobfJar` for us through the standard
// assemble lifecycle, so the artifact in build/libs has production (SRG) names and loads on a
// normal Forge server. The classes/ and dev jars in build/ are development-only and must not be
// copied to a server - see README.md.

