# PrankCraft Forge module - Gradle properties
#
# ForgeGradle 5 is used here because it is the last ForgeGradle line that supports the
# 1.16.5 toolchain. It requires Gradle 7.x, and Gradle 7.x cannot run on a JDK newer than
# 19, so the grader must launch this build with a JDK 8-17 (see README.md). The mod itself
# is compiled to Java 8 bytecode, which is what a 1.16.5 server expects.

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
# ForgeGradle resolves a lot of artifacts and caches nothing useful after a failure.
# Do not let a transient 5xx end the build.
org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000

# ---------------------------------------------------------------------------
# Mod identity - must match META-INF/mods.toml
# ---------------------------------------------------------------------------
mod_id=prankcraft
mod_name=PrankCraft
mod_version=1.0.0
mod_group=com.prankcraft
mod_authors=PrankCraft
mod_description=Consent-gated, audit-logged prank toolkit for server operators. Cosmetic effects only - nothing can harm, move or rob a player.

# ---------------------------------------------------------------------------
# Toolchain
# ---------------------------------------------------------------------------
minecraft_version=1.16.5
forge_version=36.2.34
# Official (Mojang) mappings. ForgeGradle resolves the mapping zip itself from
# https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_config/<version>/mcp_config-<version>.zip
mappings_channel=official
mappings_version=1.16.5
