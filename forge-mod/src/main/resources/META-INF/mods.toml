modLoader = "javafml"
loaderVersion = "[36,)"
license = "MIT"

# ---------------------------------------------------------------------------
# PrankCraft - server-side only.
#
# There is deliberately no client half: every effect here is delivered as vanilla
# packets to a vanilla client, so nothing has to be installed on the players'
# machines for the pranks to work. That also means a player can never be affected
# by code they did not choose to run - the worst case is a packet they do not like.
# ---------------------------------------------------------------------------
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

# This mod talks to vanilla clients through vanilla packets only, and its display
# requirements are empty: it must load on a dedicated server with no client mod present.
[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "BOTH"
